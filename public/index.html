<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humanize - Grok</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ink-bg" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="hero">
        <p class="hero-sub">VIDEO GENERATION PLATFORM</p>
        <h1>Humanize - Grok</h1>
        <p>
          Generate production-ready videos from prompt and optional reference image.
          Configure duration, resolution, and aspect ratio.
        </p>
      </header>

      <section class="panel">
        <form id="generateForm" class="form-grid">
          <label>
            OpenAI API Key (for prompt generation)
            <input
              type="password"
              name="openai_api_key"
              placeholder="sk-..."
              autocomplete="off"
              required
            />
          </label>

          <label>
            XAI API Key (for video generation)
            <input
              type="password"
              name="api_key"
              placeholder="xai-..."
              autocomplete="off"
              required
            />
          </label>

          <label>
            Reference Image (optional)
            <input id="imageInput" type="file" name="image" accept="image/*" />
          </label>

          <label>
            Video Count
            <input type="number" name="video_count" min="1" max="8" value="3" required />
          </label>

          <div class="triple-grid">
            <label>
              Duration (seconds)
              <select name="duration" required>
                <option value="4" selected>4s</option>
                <option value="6">6s</option>
                <option value="8">8s</option>
                <option value="10">10s</option>
                <option value="12">12s</option>
                <option value="15">15s</option>
              </select>
            </label>

            <label>
              Resolution
              <select name="resolution" required>
                <option value="480p" selected>480p</option>
                <option value="720p">720p</option>
              </select>
            </label>

            <label>
              Aspect Ratio
              <select name="aspect_ratio" required>
                <option value="auto">Follow Reference (Recommended)</option>
                <option value="16:9">16:9 Landscape</option>
                <option value="9:16" selected>9:16 Portrait</option>
                <option value="1:1">1:1 Square</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
                <option value="3:2">3:2</option>
                <option value="2:3">2:3</option>
              </select>
            </label>
          </div>
          <button id="generatePromptsBtn" class="secondary-btn" type="button">Generate Prompts</button>
        </form>
      </section>

      <section id="statusBox" class="status hidden"></section>

      <section class="result" id="promptPlanSection">
        <h2>Generated Prompts</h2>
        <div id="promptPlanList" class="prompt-plan-list"></div>
        <button id="generateVideoBtn" type="button">Generate Video</button>
      </section>

      <section class="result" id="historySection">
        <h2>Generated Videos</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
